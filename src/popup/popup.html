<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tab Audio Recorder</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fff;
        --text: #1f1f1f;
        --text-secondary: #474747;
        --divider: #e1e3e1;
        --primary: #0b57d0;
        --on-primary: #fff;
        --outline: #747775;
        --danger: #b3261e;
        --on-danger: #fff;
        --chip: #f0f4f9;
        --rec: #d93025;
        --idle: #747775;
        --state-layer: rgba(11, 87, 208, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #1f1f1f;
          --text: #e3e3e3;
          --text-secondary: #c7c7c7;
          --divider: #3c3c3c;
          --primary: #a8c7fa;
          --on-primary: #062e6f;
          --outline: #8e918f;
          --danger: #f2b8b5;
          --on-danger: #601410;
          --chip: #282a2c;
          --rec: #f28b82;
          --idle: #8e918f;
          --state-layer: rgba(168, 199, 250, 0.12);
        }
      }

      body {
        width: 300px;
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font: 13px/20px "Google Sans Text", "Google Sans", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--divider);
      }
      header img { width: 20px; height: 20px; }
      header h1 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; }

      main { padding: 16px; }

      #status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--chip);
      }
      #dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--idle);
      }
      body[data-status="recording"] #dot {
        background: var(--rec);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        body[data-status="recording"] #dot { animation: none; }
      }
      #status { margin: 0; font-weight: 500; }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
        width: 100%;
        height: 36px;
        margin-bottom: 8px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 100px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: box-shadow 0.15s, background-color 0.15s, filter 0.15s;
      }
      .btn svg { flex: none; width: 18px; height: 18px; fill: currentColor; }
      .btn:disabled { opacity: 0.38; cursor: default; pointer-events: none; }
      .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      .btn.filled { background: var(--primary); color: var(--on-primary); }
      .btn.filled:hover {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        filter: brightness(0.94);
      }
      body[data-status="recording"] .btn.filled { background: var(--danger); color: var(--on-danger); }

      .btn.outlined { background: transparent; border-color: var(--outline); color: var(--primary); }
      .btn.outlined:hover { background: var(--state-layer); }

      body:not([data-status="recording"]) .icon-stop,
      body[data-status="recording"] .icon-start,
      body:not([data-hear="true"]) .icon-volume-up,
      body[data-hear="true"] .icon-volume-off { display: none; }

      #error { margin: 8px 0 0; color: var(--danger); }
      #error:empty { display: none; }
      #hint { margin: 8px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 16px; }
    </style>
  </head>
  <body>
    <header>
      <img src="../../icons/icon48.png" alt="">
      <h1>Tab Audio Recorder</h1>
    </header>
    <main>
      <div id="status-row">
        <span id="dot"></span>
        <p id="status">Loading…</p>
      </div>
      <button id="rec" class="btn filled">
        <svg class="icon-start" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="label"></span>
      </button>
      <button id="hear" class="btn outlined">
        <svg class="icon-volume-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="icon-volume-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        <span class="label"></span>
      </button>
      <p id="error"></p>
      <p id="hint">Muting only changes what you hear. The recording always gets the full audio.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
