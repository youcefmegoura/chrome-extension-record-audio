<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tab Audio Recorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="../../icons/icon48.png" alt="">
      <h1>Tab Audio Recorder</h1>
    </header>
    <main>
      <div id="status-row">
        <span id="dot"></span>
        <p id="status" role="status">Loading…</p>
      </div>
      <button id="rec" class="btn filled">
        <svg class="icon-start" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="label"></span>
      </button>
      <button id="hear" class="btn outlined">
        <svg class="icon-volume-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="icon-volume-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        <span class="label"></span>
      </button>
      <section id="schedule" aria-labelledby="schedule-title">
        <h2 id="schedule-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
          Stop automatically
        </h2>
        <form id="schedule-form" novalidate>
          <div id="duration">
            <label class="field"><input id="hours" type="number" min="0" max="23" step="1" value="1" inputmode="numeric" aria-label="Hours">h</label>
            <label class="field"><input id="minutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="Minutes">min</label>
            <label class="field"><input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="Seconds">s</label>
          </div>
          <button id="schedule-btn" type="submit" class="btn tonal"></button>
        </form>
        <p id="schedule-note">Stops and saves at <time id="stop-time"></time></p>
      </section>
      <p id="error" role="alert"></p>
      <p id="hint">Muting only changes what you hear. The recording always gets the full audio.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
